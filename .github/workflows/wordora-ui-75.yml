name: Wordora 7.9 safety regression and preview build
on:
  push:
    branches: [main, 'feature/wordora-7-9']
    paths:
      - '.github/workflows/wordora-ui-75.yml'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Wordora
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full automated JS regression suite
        run: npm test
      - name: Build Wordora preview without production credentials
        run: npm run build:preview
      - name: Verify 7.6 PWA and security files
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/wordora-v76.js
          test -s dist/wordora-v76.css
          test -s dist/_headers
          test -s supabase/security_audit_7_7.sql
          test -s dist/service-worker.js
          grep -q 'wordora-v76.js' dist/index.html
          grep -q 'wordora-pwa-7.9.0' dist/service-worker.js
          grep -q 'X-Frame-Options: DENY' dist/_headers
          test -s dist/wordora-v78.js
          test -s dist/wordora-v78.css
          grep -q 'wordora-v78.js' dist/index.html
          test -s scripts/release-gate.mjs
          echo 'Wordora 7.9 assets verified.'
