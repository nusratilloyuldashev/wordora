name: Wordora bounded public-asset smoke load
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wordora-smoke-load.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wordora-bounded-smoke-test
  cancel-in-progress: false
jobs:
  static-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Wordora
        uses: actions/checkout@v4
      - name: Node environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage A - 10 users (public assets only)
        env:
          BASE_URL: https://wordora.pages.dev
          VUS: '10'
          DURATION_SEC: '20'
          PAUSE_MS: '1500'
        run: node scripts/wordora-smoke-load.mjs
      - name: Stage B - 30 users (public assets only)
        env:
          BASE_URL: https://wordora.pages.dev
          VUS: '30'
          DURATION_SEC: '20'
          PAUSE_MS: '1500'
        run: node scripts/wordora-smoke-load.mjs
      - name: Stage C - 100 users (public assets only)
        env:
          BASE_URL: https://wordora.pages.dev
          VUS: '100'
          DURATION_SEC: '20'
          PAUSE_MS: '2500'
        run: node scripts/wordora-smoke-load.mjs
