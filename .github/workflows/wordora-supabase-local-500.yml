name: Wordora local Supabase Auth + REST 500 VU test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wordora-supabase-local-500.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wordora-supabase-local-500
  cancel-in-progress: false
jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Wordora (no production credentials)
        uses: actions/checkout@v4
      - name: Prepare Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated LOCAL Supabase Auth, REST and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          # No 'supabase link', so no remote project or production credentials.
          # Excluding unused services reduces memory and GitHub Actions usage.
          if ! supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor,mailpit > "$RUNNER_TEMP/wordora-stack-start.log" 2>&1; then
            echo 'Could not start local Supabase stack (Auth, REST, PostgreSQL).'
            echo 'No hosted Supabase project was contacted or modified.'
            exit 1
          fi
          supabase status -o env > "$RUNNER_TEMP/wordora-local-supabase.env"
          echo 'Local Supabase stack healthy; credentials stored only on ephemeral runner.'
      - name: Apply the existing Wordora migrations to LOCAL database only
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          for f in supabase/setup.sql supabase/upgrade_3_0.sql supabase/upgrade_4_0.sql supabase/upgrade_5_0.sql; do
            echo "Applying local $f"
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f "$f" > "$RUNNER_TEMP/wordora-sql-apply.log"
          done
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -c "INSERT INTO public.words(category,en,uz,level,topic,word_type)
                SELECT 'study','testload_'||lpad(n::text,4,'0'),'tarjima_'||n,'A1','study','noun'
                FROM generate_series(1,600) n" > /dev/null
          echo 'Wordora migrations and 600 synthetic starter words applied locally.'
      - name: Install local test dependencies (not committed to production)
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2.57.2
      - name: Run 100, 250 and 500 LOCAL Auth + REST user flows
        env:
          SUPABASE_LOCAL_STATUS_FILE: ${{ runner.temp }}/wordora-local-supabase.env
        run: node scripts/wordora-local-supabase-500.mjs
      - name: Stop and dispose local test stack
        if: always()
        run: supabase stop --no-backup > /dev/null 2>&1 || true
